name: eventnest-dotnet

# ============================================================
# EventNest (.NET) -- one-command local stack
#   Start:  docker compose up --build -d
#   Logs:   docker compose logs -f gateway
#   Stop:   docker compose down
#   Wipe:   docker compose down -v
# ============================================================

services:
  # ----------------------------------------------------------
  # Infrastructure (internal-only, no host ports)
  # ----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./EventNest/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Provisioned for the deferred async-messaging design (decision D8).
  # No publisher/consumer is wired yet; the topology stays ready when messaging lands.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Microservices (internal-only; EF migrations + seeds run on startup)
  # ----------------------------------------------------------
  auth-service:
    build:
      context: ./EventNest
      dockerfile: services/EventNest.AuthService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__AuthDb: "Host=postgres;Port=5432;Database=eventnest_auth;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SecretKey: ${JWT_SECRET_KEY:-dev-only-secret-change-me-32-chars-min}
      Jwt__Issuer: ${JWT_ISSUER:-EventNest.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-EventNest}
      Jwt__AccessTokenExpiryMinutes: ${JWT_ACCESS_EXPIRY:-60}
      Jwt__RefreshTokenExpiryDays: ${JWT_REFRESH_EXPIRY:-30}
      # Local HTTP only; set COOKIE_SECURE=true when serving over HTTPS.
      Cookie__Secure: ${COOKIE_SECURE:-false}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_1:-https://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  tag-service:
    build:
      context: ./EventNest
      dockerfile: services/EventNest.TagService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__TagDb: "Host=postgres;Port=5432;Database=eventnest_tag;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SecretKey: ${JWT_SECRET_KEY:-dev-only-secret-change-me-32-chars-min}
      Jwt__Issuer: ${JWT_ISSUER:-EventNest.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-EventNest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  event-service:
    build:
      context: ./EventNest
      dockerfile: services/EventNest.EventService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__EventDb: "Host=postgres;Port=5432;Database=eventnest_event;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SecretKey: ${JWT_SECRET_KEY:-dev-only-secret-change-me-32-chars-min}
      Jwt__Issuer: ${JWT_ISSUER:-EventNest.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-EventNest}
      Services__Auth__GrpcUrl: "http://auth-service:51001"
      Services__Tag__GrpcUrl: "http://tag-service:51003"
      Services__Rsvp__GrpcUrl: "http://rsvp-service:51004"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASS:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      tag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  rsvp-service:
    build:
      context: ./EventNest
      dockerfile: services/EventNest.RSVPService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__RsvpDb: "Host=postgres;Port=5432;Database=eventnest_rsvp;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SecretKey: ${JWT_SECRET_KEY:-dev-only-secret-change-me-32-chars-min}
      Jwt__Issuer: ${JWT_ISSUER:-EventNest.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-EventNest}
      Services__Event__GrpcUrl: "http://event-service:51002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      event-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ----------------------------------------------------------
  # API Gateway -- single public API entry point
  # ----------------------------------------------------------
  gateway:
    build:
      context: ./EventNest
      dockerfile: services/EventNest.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Jwt__SecretKey: ${JWT_SECRET_KEY:-dev-only-secret-change-me-32-chars-min}
      Jwt__Issuer: ${JWT_ISSUER:-EventNest.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-EventNest}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_1:-https://localhost:5173}
      ReverseProxy__Clusters__auth-cluster__Destinations__auth-1__Address: "http://auth-service:5001/"
      ReverseProxy__Clusters__event-cluster__Destinations__event-1__Address: "http://event-service:5002/"
      ReverseProxy__Clusters__tag-cluster__Destinations__tag-1__Address: "http://tag-service:5003/"
      ReverseProxy__Clusters__rsvp-cluster__Destinations__rsvp-1__Address: "http://rsvp-service:5004/"
      HealthChecks__AuthService: "http://auth-service:5001/health"
      HealthChecks__EventService: "http://event-service:5002/health"
      HealthChecks__TagService: "http://tag-service:5003/health"
      HealthChecks__RSVPService: "http://rsvp-service:5004/health"
    ports:
      - "5000:5000"
    depends_on:
      auth-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      tag-service:
        condition: service_healthy
      rsvp-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ----------------------------------------------------------
  # UI -- nginx serves the built SPA and proxies /api to the gateway
  # ----------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

# ──────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────
volumes:
  postgres-data:
  rabbitmq-data:
